monitor=,preferred,auto,auto, bitdepth, 10, cm, hdr


env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDB_BACKEND,wayland,x11,*
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = GDK_SCALE,1

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM, wayland
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ua
    kb_variant = colemak,
    kb_model = pc105
    kb_options = grp:rctrl_rshift_toggle,compose:ralt

    follow_mouse = 1
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 8
}

source = ~/.config/hypr/animations.conf

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

misc {
    focus_on_activate = true
}

windowrule = suppress_event maximize, match:class .*

# Tag all windows for default opacity (apps can override with -default-opacity tag)
windowrule = tag +default-opacity, match:class .*

windowrule = opacity 0.97 0.9, match:class .*
windowrule = opacity 0.97 0.9, match:tag default-opacity
# Browser types
windowrule = tag +firefox-based-browser, match:class ([fF]irefox|zen|librewolf)
windowrule = tag -default-opacity, match:tag firefox-based-browser

# Video apps: remove chromium browser tag so they don't get opacity applied
windowrule = tag -default-opacity, match:class (chrome-youtube.com__-Default|chrome-app.zoom.us__wc_home-Default)

windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 875 600, match:tag floating-window

windowrule = tag +floating-window, match:class (About|TUI.float|imv|mpv)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|DesktopEditors), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)

# No transparency on media windows
windowrule = tag -default-opacity, match:class ^(mpv)$
windowrule = opacity 1 1, match:class ^(mpv)$

# Popped window rounding
windowrule = rounding 8, match:tag pop

# Prevent idle while open
windowrule = idle_inhibit always, match:tag noidle

# Define terminal tag to style them uniformly
windowrule = tag +terminal, match:class (Alacritty|kitty|com.mitchellh.ghostty)
windowrule = tag -default-opacity, match:tag terminal
windowrule = opacity 0.97 0.9, match:tag terminal
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$



# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bindd = $mainMod, space, Launch apps, exec, walker -p "Start…"
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, ghostty

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Backspace, exit,

bind = $mainMod, minus, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod SHIFT, return, fullscreen

bind = $mainMod, G, togglegroup, # dwindle
bind = $mainMod CTRL, bracketleft, changegroupactive,b
bind = $mainMod CTRL, bracketright, changegroupactive,f

bind = $mainMod, bracketleft, cyclenext, prev
bind = $mainMod, bracketright, cyclenext

bind = $mainMod SHIFT, bracketleft, swapnext, prev
bind = $mainMod SHIFT, bracketright, swapnext

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, a, workspace, 1
bind = $mainMod, r, workspace, 2
bind = $mainMod, s, workspace, 3
bind = $mainMod, t, workspace, 4
bind = $mainMod, z, workspace, 5
bind = $mainMod, x, workspace, 6
bind = $mainMod, c, workspace, 7
bind = $mainMod, v, workspace, 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, a, movetoworkspace, 1
bind = $mainMod SHIFT, r, movetoworkspace, 2
bind = $mainMod SHIFT, s, movetoworkspace, 3
bind = $mainMod SHIFT, t, movetoworkspace, 4
bind = $mainMod SHIFT, z, movetoworkspace, 5
bind = $mainMod SHIFT, x, movetoworkspace, 6
bind = $mainMod SHIFT, c, movetoworkspace, 7
bind = $mainMod SHIFT, v, movetoworkspace, 8

bind = $mainMod, l, workspace, r+1
bind = $mainMod, h, workspace, r-1

# Example special workspace (scratchpad)
bind = $mainMod, n, togglespecialworkspace, magic
bind = $mainMod SHIFT, n, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/xdg-portal-hyprland

exec-once = waybar
exec-once = dunst
exec-once = /usr/lib64/libexec/polkit-kde-authentication-agent-1

exec-once=hyprpaper

