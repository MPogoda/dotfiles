monitor=,preferred,auto,auto


env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ua
    kb_variant = colemak,
    kb_model = pc105
    kb_options = grp:rctrl_rshift_toggle,compose:ralt

    follow_mouse = 1
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 8
}

source = ~/.config/hypr/animations.conf

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

misc {
}

windowrulev2 = float,class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float,class:^(org.kde.polkit-kde-authentication-agent-1)$


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bindr = $mainMod, space, exec, pkill wofi || wofi --show drun
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, ghostty

bind = $mainMod, Q, killactive,
bind = $mainMod, Backspace, exit,

bind = $mainMod, minus, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod SHIFT, return, fullscreen

bind = $mainMod, G, togglegroup, # dwindle
bind = $mainMod CTRL, bracketleft, changegroupactive,b
bind = $mainMod CTRL, bracketright, changegroupactive,f

bind = $mainMod, bracketleft, cyclenext, prev
bind = $mainMod, bracketright, cyclenext

bind = $mainMod SHIFT, bracketleft, swapnext, prev
bind = $mainMod SHIFT, bracketright, swapnext

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, a, workspace, 1
bind = $mainMod, r, workspace, 2
bind = $mainMod, s, workspace, 3
bind = $mainMod, t, workspace, 4
bind = $mainMod, z, workspace, 5
bind = $mainMod, x, workspace, 6
bind = $mainMod, c, workspace, 7
bind = $mainMod, v, workspace, 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, a, movetoworkspace, 1
bind = $mainMod SHIFT, r, movetoworkspace, 2
bind = $mainMod SHIFT, s, movetoworkspace, 3
bind = $mainMod SHIFT, t, movetoworkspace, 4
bind = $mainMod SHIFT, z, movetoworkspace, 5
bind = $mainMod SHIFT, x, movetoworkspace, 6
bind = $mainMod SHIFT, c, movetoworkspace, 7
bind = $mainMod SHIFT, v, movetoworkspace, 8

bind = $mainMod, l, workspace, r+1
bind = $mainMod, h, workspace, r-1

# Example special workspace (scratchpad)
bind = $mainMod, n, togglespecialworkspace, magic
bind = $mainMod SHIFT, n, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/xdg-portal-hyprland

# env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1

exec-once = waybar
exec-once = dunst
exec-once = /usr/lib64/libexec/polkit-kde-authentication-agent-1

exec-once=hyprpaper

